<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="SQUIP mark: a peptide backbone resolving into an S(q,omega) scattering peak">
  <title>SQUIP</title>
  <defs>
    <linearGradient id="squip-curve-grad" x1="82" y1="96" x2="152" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B6E7A"/>
      <stop offset="1" stop-color="#F5A045"/>
    </linearGradient>
  </defs>

  <!-- spectrum baseline (omega axis) -->
  <line x1="82" y1="112" x2="152" y2="112" stroke="#142225" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6"/>

  <!-- peptide backbone bonds -->
  <g stroke="#1B6E7A" stroke-width="5" stroke-linecap="round">
    <line x1="18" y1="128" x2="40" y2="106"/>
    <line x1="40" y1="106" x2="60" y2="120"/>
    <line x1="60" y1="120" x2="82" y2="96"/>
  </g>

  <!-- S(q,omega) peak, continuing the backbone as one line -->
  <path d="M82,96 C96,68 104,28 120,28 C136,28 142,70 152,112" fill="none" stroke="url(#squip-curve-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- backbone atoms -->
  <g stroke="#123A43" stroke-width="1.5">
    <circle cx="18" cy="128" r="5" fill="#1B6E7A"/>
    <circle cx="40" cy="106" r="7.5" fill="#1B6E7A"/>
    <circle cx="60" cy="120" r="5" fill="#1B6E7A"/>
    <circle cx="82" cy="96" r="7.5" fill="#1B6E7A"/>
  </g>

  <!-- peak apex marker -->
  <circle cx="120" cy="28" r="6" fill="#F5A045" stroke="#E0781F" stroke-width="1.5"/>
</svg>
